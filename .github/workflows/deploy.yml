name: Create and publish a Docker image to GitHub Container Registry for prod

on:
  push:
    branches: ['prod']
    # branches: ['main']

env:
  REGISTRY: ghcr.io
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        id: image_name
        run: |
          LOWERCASE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${LOWERCASE_OWNER}/cowing-msa-front"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate version tag
        id: version
        run: |
          DATE_VERSION="$(date +'%Y.%m.%d')"
          SHORT_SHA="$(echo $GITHUB_SHA | cut -c1-7)"
          VERSION="${DATE_VERSION}-${SHORT_SHA}"
          
          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.image_name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.image_name }}:latest 
            
      # Docker 로그인 step에 id 추가
      - name: Log in to the Container registry
        id: docker_login
        continue-on-error: true  # 에러가 나도 계속 진행
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 로그 수집 step
      - name: Collect Logs
        id: collect_logs
        if: failure()
        run: |
          echo "### Error Details" > error_logs.txt
          echo "Step: ${{ steps.docker_login.outcome }}" >> error_logs.txt
          echo "Error occurred during Docker login" >> error_logs.txt
          echo "Registry: ${{ env.REGISTRY }}" >> error_logs.txt
          echo "Username: ${{ github.actor }}" >> error_logs.txt
          
          # 에러 로그를 환경 변수로 저장
          ERROR_LOGS=$(cat error_logs.txt)
          echo "error_logs<<EOF" >> $GITHUB_ENV
          echo "$ERROR_LOGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Discord Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR=$( [ "$STATUS" == "success" ] && echo "3066993" || echo "15158332" )
          EMOJI=$( [ "$STATUS" == "success" ] && echo "🚀" || echo "❌" )
          
          # 에러 로그 준비
          ERROR_SECTION=""
          if [ "$STATUS" == "failure" ]; then
            ERROR_SECTION=', {
              "name": "Error Details",
              "value": "```\n${{ env.error_logs }}\n```"
            }'
          fi
          
          curl -H "Content-Type: application/json" -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} -d '{
            "embeds": [{
              "title": "'"$EMOJI"' 빌드 '"$STATUS"'",
              "color": '"$COLOR"',
              "fields": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                },
                {
                  "name": "Commit",
                  "value": "${{ github.sha }}",
                  "inline": true
                },
                {
                  "name": "Author",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "Image",
                  "value": "${{ env.REGISTRY }}/${{ steps.image_name.outputs.image_name }}:${{ steps.version.outputs.version }}"
                }
                '"$ERROR_SECTION"'
              ]
            }]
          }'