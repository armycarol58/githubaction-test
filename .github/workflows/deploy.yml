name: Create and publish a Docker image to GitHub Container Registry for prod

on:
  push:
    branches: ['prod']
    # branches: ['main']

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        id: image_name
        run: |
          LOWERCASE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${LOWERCASE_OWNER}/cowing-msa-front"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate version tag
        id: version
        run: |
          DATE_VERSION="$(date +'%Y.%m.%d')"
          SHORT_SHA="$(echo $GITHUB_SHA | cut -c1-7)"
          VERSION="${DATE_VERSION}-${SHORT_SHA}"
          
          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.image_name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.image_name }}:latest 
            
      # URL 파싱하여 ID와 TOKEN 추출
      - name: Extract Discord Webhook Info
        id: discord
        run: |
          WEBHOOK_ID=$(echo $DISCORD_WEBHOOK_URL | cut -d'/' -f6)
          WEBHOOK_TOKEN=$(echo $DISCORD_WEBHOOK_URL | cut -d'/' -f7)
          echo "webhook_id=$WEBHOOK_ID" >> $GITHUB_OUTPUT
          echo "webhook_token=$WEBHOOK_TOKEN" >> $GITHUB_OUTPUT

      # Discord로 성공 메시지 전송
      - name: Discord notification - Success
        if: success()
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#43b581"
          username: "GitHub Actions Bot"
          message: |
            🚀 **빌드 성공!**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Build Time:** ${{ steps.timestamp.outputs.timestamp }}
            
            **Image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`
            
            **Commit Message:**
            ```
            ${{ github.event.head_commit.message }}
            ```
            
      # Discord로 실패 메시지 전송
      - name: Discord notification - Failure
        if: failure()
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#ff0000"
          username: "GitHub Actions Bot"
          message: |
            ❌ **빌드 실패!**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Build Time:** ${{ steps.timestamp.outputs.timestamp }}
            
            **Error Details:**
            작업이 실패했습니다. GitHub Actions 로그를 확인해주세요.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}